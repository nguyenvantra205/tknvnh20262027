<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>HỆ THỐNG NỘI BỘ</title>

  <!-- Khai báo PWA cho Android / Chrome -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">

  <!-- Khai báo PWA toàn màn hình cho iOS (Safari) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="HỆ THỐNG NỘI BỘ">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f3f4f6;
      /* Hỗ trợ tai thỏ / Dynamic Island trên iPhone */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    /* Màn hình chờ trong lúc Apps Script đang tải */
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      z-index: 10;
      font-family: sans-serif;
      color: #2563eb;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e5e7eb;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 20;
    }
  </style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <p style="font-size: 14px; font-weight: 600;">Đang tải ứng dụng...</p>
  </div>

  <!-- THAY LINK WEB APP GOOGLE APPS SCRIPT CỦA BẠN VÀO ĐÂY -->
  <iframe 
    id="gas-frame"
    src="https://script.google.com/macros/s/AKfycbxEYmd1Ng27bYlcZWbADDhUb026Pzd4cBVV6gXE4GjGj8RSPFrzic5_dCDs4Gd_OR0L/exec"
    allow="camera; microphone; geolocation"
    onload="document.getElementById('loader').style.display='none';">
  </iframe>

  <script>
    // Đăng ký Service Worker để Chrome Android hiện nút "Cài đặt ứng dụng"
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.log('SW registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
